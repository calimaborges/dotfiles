# A basic hyprlock configuration
# Save this file to ~/.config/hypr/hyprlock.conf

# General settings
general {
    # Hides the cursor while the lock screen is active
    hide_cursor = false
    # Disable the fade-in animation for a quicker lock
    no_fade_in = true
}

# The background widget
background {
    # Use a screenshot of the current desktop as the background
    # This is a great way to get a quick, blurred background effect
    path = screenshot
    
    # Blurring and other effects
    blur_passes = 2           # Number of blur passes (0 to disable)
    blur_size = 7             # The size of the blur in pixels
    noise = 0.0117            # The amount of noise to add to the blur
    
    # Optional: If you don't want a blurred screenshot, you can use a solid color
    # color = rgba(25, 20, 20, 1.0)
    
    # Or a static image
    # path = /path/to/your/image.png
}

# The input field for your password
input-field {
    # Position the input field in the center of the screen
    halign = center
    valign = center

    # Dimensions of the input field
    size = 250, 50

    # Colors
    inner_color = rgba(0, 0, 0, 0.4)      # Color of the inside of the box
    outer_color = rgba(0, 0, 0, 0.6)      # Color of the border
    font_color = rgb(255, 255, 255)       # Color of the text (dots)
    
    # Rounding for a pill shape
    rounding = -1
    
    # The text that appears when the input field is empty
    placeholder_text = <i>Input Password...</i>
}

# A label to show the current time
label {
    # Align the label to the center, slightly above the input field
    halign = center
    valign = center
    position = 0, -80

    # The text to display. We'll use a command to get the current time.
    # The 'update' parameter tells hyprlock to run the command every 1000ms (1 second).
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    
    # Font and color settings
    font_size = 48
    font_family = sans-serif
    color = rgba(255, 255, 255, 0.8)
}

# A label for a welcome message or the date
label {
    halign = center
    valign = center
    position = 0, 80
    
    # We'll use a command to get the date.
    text = cmd[update:10000] echo "$(date +"%A, %B %d")"
    
    font_size = 24
    font_family = sans-serif
    color = rgba(255, 255, 255, 0.6)
}
